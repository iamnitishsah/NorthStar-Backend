name: NorthStar CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Temporary .env for Build
        run: |
          echo "GATEWAY_PORT=8000" > .env
          echo "JWT_SECRET=testsecret" >> .env
          echo "JWT_REFRESH_SECRET=testrefresh" >> .env

      - name: Build Docker Compose Stack
        # This confirms your Dockerfile and requirements.txt compile successfully
        run: docker compose build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd NorthStar-Backend
            git pull origin main
            docker compose up --build -d