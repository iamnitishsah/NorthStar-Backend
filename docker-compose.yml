name: northstar

x-app-env: &app-env
  # Container-network hostnames override whatever .env says
  MONGO_URI: mongodb://mongo:27017/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379/0
  # Mailpit catches all outgoing mail: no real SMTP needed, UI at http://localhost:8025
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_USE_TLS: "false"

services:
  api:
    build: .
    image: northstar-app:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment: *app-env
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: northstar-app:dev
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file: .env
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"   # exposed so you can inspect data with Compass or mongosh
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"   # web UI + REST API (handy for asserting emails in tests)
      - "1025:1025"   # SMTP

volumes:
  mongo_data: